[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facility-research"
version = "0.1.0"
description = "Supplier facility research pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "rapidfuzz>=3.10.0",
    "supabase>=2.10.0",
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "fakeredis>=2.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared", "api", "worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
