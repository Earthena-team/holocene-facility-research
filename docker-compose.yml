services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8006:8000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - redis
    # Cloud Run: CPU always allocated, min instances 1, max 1 initially.
    # Local compose mirrors a single long-running worker.
